<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../../../bootstrap-5.3.7-dist/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="w-100">
        <img src="../../../Imagenes/Banner.png" alt="" class="img-fluid"
            style="width: 100%; max-height: 160px; object-fit: cover;">
    </div>

    <a href="../INFO_INDIVIDUAL.html" class="rounded-pill m-4 volver"><span
            class="material-symbols-outlined mx-2">logout</span>Volver</a>

    <div class="caja rounded-5 m-4">

        <div class="row">

            <div class="col">



            </div>

            <div class="col">

                <div class="upload-container" onclick="document.getElementById('fileInput').click()">
                    <div class="icon-wrapper">
                        <span class="material-symbols-outlined" style="font-size: 20rem; color: white;">docs</span>
                    </div>
                    <div class="file-name" id="fileName">Ningún archivo seleccionado</div>
                </div>

                <input type="file" id="fileInput" onchange="updateFileName()">

            </div>

        </div>

    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            if (input.files.length > 0) {
                fileName.textContent = input.files[0].name;
            } else {
                fileName.textContent = 'Ningún archivo seleccionado';
            }
        }
    </script>

    <script src="../../../bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
