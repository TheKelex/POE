<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../../../bootstrap-5.3.7-dist/css/bootstrap.css">
</head>

<body>

    <div class="w-100">
        <img src="../../../Imagenes/Banner.png" alt="" class="img-fluid" style="width: 100%; max-height: 160px; object-fit: cover;">
    </div>

    <!--editor foro titulo-->

        <div class="container my-5">
                <h1 class="titulo_principal" style="text-align: center;">EDITOR DE FORO</h1>
        </div>

    </div>

    <!--Fin editor foro titulo-->



  <div style="background-color: #838383; padding: 30%; border: 1px solid; margin: 1%; position: relative;" class="margen rounded-5"> <!--parte del cuadro "negro" 1-->

    <div style="background-color: #ffffff; padding: 1%; margin: 1%; position: absolute; top: 0; left: 36%; width: 30%; height: 6%; list-style: none;" class="margen rounded-5">
        <form action="">
            <li>
                <input style="border:none white" type="text" name="titulo" class="form-control" id="titulo" aria-describedby="emailHelp" placeholder="ingrese el titulo">
            </li>
        </form>
    </div>
     <div style="background-color: #ffffff; padding: 1%; margin: 1%; position: absolute; top: 10%; left: 10%; width: 80%; height: 35%; list-style: none;" class="margen rounded-5">
        <form action="">
            <li>
                <textarea style="border:none white" name="encabezado" class="form-control" id="encabezado" cols="1" rows="15" placeholder="ingrese el encabezado"></textarea>
            </li>
        </form>
    </div>
</div>

</div>
<!--fin parte del cuadro "negro" 1-->


    <br><br>

    <img src="../../../Imagenes/HR.png" class="img-fluid" width="100%">



    <script src="./bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
